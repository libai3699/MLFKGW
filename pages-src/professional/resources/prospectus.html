			process_scr: function() {
				let _main = _host_page_custom_block;

				let _keys = _main.scr_key;
				let _max_key = _keys.length;
				for (var i=0; i < _max_key; i++ ) {
					let _scr_key = _keys[i];
					let _mob_lib = _main.mob_library[i];
					let _reseller = _main.library_reseller[i];
					let _res_container = _main.reseller_container[i];

					if ( _scr_key != '' ) {
						_scr_key = _scr_key.replace(/^mob/ig,'').replace(/^scriptlet_/,'');
						// set up scriptlet
						let _scr = '<div id="mob'+_scr_key+'" class="mob_embedded"></div>';
						$i2u('#mob_component'+i).html(_scr);

						let s=document.createElement('script');
						s.setAttribute("type","text/javascript");
						s.setAttribute("async","async");
						s.setAttribute('id','mob_script_'+_scr_key);
						if ( location.href.toLowerCase().indexOf('preview.online') != -1 ) {
							s.src = '//preview.onlineprospectus.net/'+_res_container+'/'+_reseller+'/'+_mob_lib+'/UI_kits/DGWebCmp/js/mobular/embed.php?mid='+_scr_key;
						} else {
							s.src = '//'+_mob_lib+'.onlineprospectus.net/'+_mob_lib+'/DGWebCmp/js/mobular/embed.php?mid='+_scr_key;
						}
						document.getElementById('mob_component'+i).appendChild(s);
					}

				}
			},

					characterDataOldValue: true
				});

				// set arrays. 
				// NOTE:right now the data is arrays. Eventually we will figure out a way to auto setup 
				// a default of 1 to n scriplets. right now it is just one
				_main.scr_key = _cfg.scr_key;
				_main.mob_library = _cfg.mob_library;
				_main.library_reseller = _cfg.library_reseller;
				_main.reseller_container = _cfg.reseller_container;
